[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["token_tracker"]

[tool.vulture]
paths = ["token_tracker.py"]
min_confidence = 60
verbose = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=token_tracker --cov-report=term-missing -v"
