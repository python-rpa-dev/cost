[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-tracker"
version = "0.1.0"
description = "Track LLM token usage and costs from opencode."
requires-python = ">=3.9"
dependencies = [
    "filelock>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
token-tracker = "token_tracker:main"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["token_tracker"]

[tool.vulture]
paths = ["token_tracker.py"]
min_confidence = 60
verbose = true
ignore_names = ["input_price_per_m", "output_price_per_m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=token_tracker --cov-report=term-missing -v"
