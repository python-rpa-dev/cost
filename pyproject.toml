[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-tracker"
version = "0.2.0"
description = "Track LLM token usage and costs from client harnesses (opencode, oh-my-pi)."
requires-python = ">=3.9"
dependencies = [
    "filelock>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[project.scripts]
token-tracker = "token_tracker:main"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["token_tracker"]

[tool.vulture]
# tests are scanned so public API used by them (e.g. track_tokens) counts as live;
# the three names below are TotalsEntry TypedDict members, read via subscript — vulture blind spot
paths = ["token_tracker.py", "tests"]
min_confidence = 60
ignore_names = ["input", "output", "total_cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=token_tracker --cov-report=term-missing -v"

[tool.coverage.run]
data_file = "data/.coverage"
